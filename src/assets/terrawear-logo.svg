<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" width="100%" height="100%">
  <!-- TerraWear Full Logo: Emblem + Wordmark -->
  <g transform="translate(10, 10)">
    <!-- Circular Emblem Badge -->
    <g transform="translate(10, 5)">
      <!-- Main circular badge in deep forest green #344B3A -->
      <circle cx="45" cy="45" r="45" fill="#344B3A" />
      
      <!-- Off-white circular dot in upper-left quadrant -->
      <circle cx="34" cy="38" r="9" fill="#F4F3ED" />
      
      <!-- Clipped sage-green lower-right crescent section -->
      <clipPath id="circleClip">
        <circle cx="45" cy="45" r="45" />
      </clipPath>
      <path d="M 33 90 C 35 68, 55 52, 85 52 C 90 52, 90 55, 90 60 C 90 85, 70 90, 33 90 Z" 
            fill="#7A8F7B" 
            clip-path="url(#circleClip)" />
      <!-- White boundary stroke creating delicate separation curve -->
      <path d="M 31 92 C 34 67, 56 50, 91 50" 
            fill="none" 
            stroke="#F4F3ED" 
            stroke-width="3.5" 
            stroke-linecap="round" 
            clip-path="url(#circleClip)" />
    </g>

    <!-- Wordmark "TerraWear" -->
    <text x="130" y="64" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="54" 
          font-weight="700" 
          fill="#1C241E" 
          letter-spacing="-0.03em">Terra<tspan font-weight="600" fill="#344B3A">Wear</tspan></text>
  </g>
</svg>